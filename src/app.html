<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
		<script>
			(function() {
				// id -> base. Mantener en sync con src/lib/ui/themes.ts
				var THEMES = { light: 'light', dark: 'dark', liquid: 'dark' };
				var stored = localStorage.getItem('theme');
				var theme = Object.prototype.hasOwnProperty.call(THEMES, stored)
					? stored
					: (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
				document.documentElement.classList.toggle('dark', THEMES[theme] === 'dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
